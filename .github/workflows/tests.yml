name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: {}

# 読むだけのジョブなので、トークンの権限は最小にする。
permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    # ハングしたジョブが既定の6時間走り続けるのを防ぐ
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest
