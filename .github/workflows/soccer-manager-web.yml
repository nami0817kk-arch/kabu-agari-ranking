name: Deploy Soccer Manager (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
      - claude/mobile-app-development-q8pq5s
    paths:
      - "soccer_manager/**"
      - ".github/workflows/soccer-manager-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: soccer_manager
        run: flutter pub get

      - name: Build web
        working-directory: soccer_manager
        run: flutter build web --release --base-href "/kabu-agari-ranking/play/"

      - name: Assemble Pages artifact
        run: |
          mkdir -p dist/play
          cp -r soccer_manager/build/web/* dist/play/
          cat > dist/index.html << 'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
            <meta charset="utf-8">
            <title>kabu-agari-ranking</title>
          </head>
          <body>
            <p><a href="./play/">サッカー経営マネージャー（試験公開）を開く</a></p>
          </body>
          </html>
          HTML

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
