name: Daily Gainers Site

on:
  schedule:
    # 16:00 JST（東証大引け15:30後）= 07:00 UTC、平日のみ
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  # 失敗を Issue で知らせるために必要
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 取得先が応答しないまま既定の6時間走り続けるのを防ぐ。
    # 通常は数分で終わる。超えたら失敗として通知が飛ぶ。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # 壊れたパーサのまま取得・デプロイまで進むと、空のランキングで
      # サイトを上書きしてしまう。その前に落とす。
      - name: Run tests
        run: pytest

      - name: Build site
        run: python src/build_site.py

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python src/post_to_x.py

      - name: Commit ranking data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new ranking data to commit."
          else
            git commit -m "chore: 値上がりランキングデータを更新"
            git push
          fi

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"kabu-agari-ranking","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kabu-agari-ranking
          directory: output

      # スケジュール実行は、失敗しても手元で気づく機会がない。
      # 取得が止まっていることに何日も後で気づく、という壊れ方を防ぐため、
      # 落ちたら必ず Issue を立てる。
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues" \
            -d "$(printf '{"title":"[daily] ランキングの自動更新が失敗しました (%s)","body":"平日毎日の取得・デプロイジョブが失敗しました。サイトの内容が更新されていない可能性があります。\\n\\n実行ログ: %s"}' "${{ github.run_id }}" "$RUN_URL")"
