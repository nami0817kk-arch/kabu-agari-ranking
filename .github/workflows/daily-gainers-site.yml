name: Daily Gainers Site

on:
  schedule:
    # 16:00 JST（東証大引け15:30後）= 07:00 UTC、平日のみ
    - cron: "0 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  # 失敗を Issue で知らせるために必要
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 取得先が応答しないまま既定の6時間走り続けるのを防ぐ。
    # 通常は数分で終わる。超えたら失敗として通知が飛ぶ。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      # 壊れたパーサのまま取得・デプロイまで進むと、空のランキングで
      # サイトを上書きしてしまう。その前に落とす。
      - name: Run tests
        run: pytest

      - name: Build site
        run: python src/build_site.py

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python src/post_to_x.py

      - name: Commit ranking data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new ranking data to commit."
          else
            git commit -m "chore: 値上がりランキングデータを更新"
            git push
          fi

      - name: Ensure Cloudflare Pages project exists
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"kabu-agari-ranking","production_branch":"master"}'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kabu-agari-ranking
          directory: output

      # GitHub は定期ジョブの失敗を通知しないので、Issue を立てて明示的に鳴らす。
      # 既に開いている失敗 Issue があれば、増やさずコメントを足す。
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ci-failure --color B60205 --description "定期実行の失敗" --force || true
          body="$(date -u '+%Y-%m-%d %H:%M UTC') の実行が失敗しました。 ログ: ${RUN_URL}"
          existing=$(gh issue list --label ci-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "日次ランキングの取得・公開が失敗しています" --label ci-failure --body "$body"
          fi
